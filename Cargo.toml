[package]
name = "onsen-matrix"
version = "1.0.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20", default-features = false, features = [
  "bevy_window", "bevy_winit", "wayland", "bevy_render", "bevy_core_pipeline",
  "bevy_pbr", "bevy_asset", "file_watcher", "multi_threaded", "bevy_log",
  "bevy_post_process", "tonemapping_luts", "ktx2", "zstd_rust", "std", "async_executor", "png",
  "bevy_sprite", "bevy_sprite_render",
] }
bytemuck = { version = "1.25", features = ["derive"] }
fontdue = "0.9.4"
libc = "0.2"
log = "0.4"
serde_json = "1"

# Dependencies compiled with optimisation even in dev builds: Bevy is slow otherwise.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = false
